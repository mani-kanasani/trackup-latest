<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The tab mark. Modern browsers take this and fall back to favicon.ico.

    Two details do the work. The tip leans rather than pointing straight up,
    which is the difference between a flame and a water droplet. And the hot
    core inside it is what makes fire read as fire at 16 pixels, where the
    silhouette alone is too small to be recognisable.
  -->
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#ember)"/>

  <!-- Outer flame: belly at (32,41) r19, tapering to a leaning tip at y=6. -->
  <path fill="#ffffff"
        d="M40.3 8.5
           C 36.5 15.5 34.5 19.5 39.5 25.5
           C 44.5 31.5 51 34.5 51 41
           A 19 19 0 0 1 13 41
           C 13 33 20 28.5 25.5 21
           C 30 14.5 33.5 10.5 40.3 8.5 Z"/>

  <!-- The hot core. -->
  <path fill="#fde047"
        d="M35.6 29.5
           C 33.5 34 32.5 36 35 39
           C 37.6 42 41 43.6 41 47
           A 9.8 9.8 0 0 1 21.4 47
           C 21.4 42.8 25 40.4 27.9 36.5
           C 30.2 33.1 32 31 35.6 29.5 Z"/>
</svg>
